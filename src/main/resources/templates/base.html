<!DOCTYPE html>
<html 
class="light"
lang="en" 
th:fragment="parent(content, title, script)"
xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-th-replace="${title}">Document</title>

    <!-- flowbite -->
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{'/css/output.css'}">
    <link rel="stylesheet" th:href="@{'/css/style.css'}">
    <!-- font awesome -->
     <link rel="stylesheet" 
     href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" 
     integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
     crossorigin="anonymous" 
     referrerpolicy="no-referrer" />
     
</head>

<body class="dark:bg-gray-900 bg-gray-100 dark:text-white">
    <!-- common header -->
    <!-- this whole div get replace navbar.html -->
    
    <!-- if user is logged in sidebar will be shown -->
    <div th:if="${loggedinUser}">
        <div data-th-replace="~{user/user_navbar::user-navbar}">
        </div>
    </div>


    
    <!-- if user is not logged in  -->
    <div th:unless="${loggedinUser}">
        <div data-th-replace="~{navbar :: navbar}"></div>
    </div>
    
    <!-- old way of writing thymeleaf -->
    <!-- <div data-th-replace="navbar :: navbar"></div> -->
    <div>
    <!-- main content -->
    <!-- here dynamic data will come -->
    <!-- <p> base page content</p> -->
    <section data-th-replace="${content}"></section>
    </div>

    <!-- common footer -->
    <!-- <footer>
        Footer
    </footer> -->
    
    <!-- flowbite content -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.js"></script>
    <!-- sweet alert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- script to change theme -->
    <script data-th-src="@{'/javascript/script.js'}"> </script>
    <th:block data-th-replace="${script}"></th:block>
</body>
</html>
