<!DOCTYPE html>
<html lang="en" th:replace="~{base ::parent(~{::#content}, ~{::title}, ~{::script})}">
<head>
    <title>
       Add Contact
    </title>
</head>
<body>
    <!-- class="pl-64 pt-50"  -->
    <div  id="content">
        
        <!-- sidebar -->
               <!-- if user is logged in user-navbar will be shown -->
    <div th:if="${loggedinUser}">
        <div data-th-replace="~{user/sidebar::sidebar}">
        </div>
    </div> 
        

    <div class="sm:pl-64 pt-20">
       <div class="grid grid-cols-12">
        <div class="col-span-3"></div>
         <div class="col-san-12 md:col-span-6 ">
            <div class="block sm p-6 bg-white border border-gray-200 rounded-lg shadow hover:bg-gray-100 dark:bg-gray-800 dark:border-gray-700 dark:hover:bg-gray-700">
              <!-- showing message -->
              <div data-th-replace="~{message::messagebox}">

              </div>
            
              <h1 class="text-2xl font-semibold flex justify-center">ADD NEW CONTACT</h1>

              <!-- name form -->
              <form class="mt-3"
              data-th-action="@{'/user/contacts/add'}"
              data-th-object="${contactForm}"
              method="post"
              enctype="multipart/form-data"
              >
              <!-- name field -->
              <div class="mb-2">
                <label for="input-group-1" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Contact Name</label>
                        <div class="relative mb-0.5">
                        <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
                            <i class="w-4 h-4 fa-solid fa-user"></i>
                                <path d="m10.036 8.278 9.258-7.79A1.979 1.979 0 0 0 18 0H2A1.987 1.987 0 0 0 .641.541l9.395 7.737Z"/>
                                <path d="M11.241 9.817c-.36.275-.801.425-1.255.427-.428 0-.845-.138-1.187-.395L0 2.6V14a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V2.5l-8.759 7.317Z"/>
                        </div>
                        <input 
                        data-th-field="*{name}"
                        type="text" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5  dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
                        placeholder="Name"/>
                        </div>
                        <p class="text-red-600"
                        data-th-if="${#fields.hasErrors('name')}"
                        data-th-errors="*{name}"
                        >
                        Invalid nameeeee
                         </p>
              </div>
                <!-- email feild -->
                <div class="mb-2">
                    <label for="input-group-1" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Contact Email</label>
                            <div class="relative mb-0.5">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
                                <i class=" w-4 h-4 fa-solid fa-envelope"></i>
                                    <path d="m10.036 8.278 9.258-7.79A1.979 1.979 0 0 0 18 0H2A1.987 1.987 0 0 0 .641.541l9.395 7.737Z"/>
                                    <path d="M11.241 9.817c-.36.275-.801.425-1.255.427-.428 0-.845-.138-1.187-.395L0 2.6V14a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V2.5l-8.759 7.317Z"/>
                                </svg>
                            </div>
                            <input
                            data-th-field="*{email}"
                             type="text"class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5  dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
                            placeholder="example@gmail.com">
                            </div>

                            <p class="text-red-600"
                            data-th-if="${#fields.hasErrors('email')}"
                            data-th-errors="*{email}"
                            >
                            Invalid email
                             </p>
                            
                  </div>

                  <!-- phone number feild -->
                  <div class="mb-2">
                    <label for="input-group-1" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Contact Phone Number</label>
                            <div class="relative mb-0.5">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
                                <i class="w-4 h-4 fa-solid fa-phone"></i>
                                    <path d="m10.036 8.278 9.258-7.79A1.979 1.979 0 0 0 18 0H2A1.987 1.987 0 0 0 .641.541l9.395 7.737Z"/>
                                    <path d="M11.241 9.817c-.36.275-.801.425-1.255.427-.428 0-.845-.138-1.187-.395L0 2.6V14a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V2.5l-8.759 7.317Z"/>
                                </svg>
                            </div>
                            <input
                            data-th-field="*{phoneNumber}"
                             type="text" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5  dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
                            placeholder="9458767442">
                            </div>

                            
                            <p class="text-red-600"
                            data-th-if="${#fields.hasErrors('phoneNumber')}"
                            data-th-errors="*{phoneNumber}"
                            >
                            Invalid email
                             </p>
                  </div>

                  <!-- address text area field -->
                  <div class="mb-2">                    
                    <label for="message" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Contact Address</label>
                    <textarea 
                    data-th-field="*{address}"
                    rows="3" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                     placeholder="Address of the contact"></textarea>
                  </div>
                
                  <!-- description about -->
                  <div class="mb-2">                    
                    <label for="message" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                    Contact Description</label>
                    <textarea 
                    data-th-field="*{description}" 
                    rows="3" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
                    placeholder="Write about your contact"></textarea>
                  </div>
                  
                  <!-- social link -->
                  <div class="flex space-x-3 ">
                    <!-- website link -->
                    <div class="w-full">                        
                        <div class="mb-2">                            
                                    <div class="relative mb-3">
                                    <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
                                        <i class="w-4 h-4 fa-solid fa-earth-americas"></i>
                                            <path d="m10.036 8.278 9.258-7.79A1.979 1.979 0 0 0 18 0H2A1.987 1.987 0 0 0 .641.541l9.395 7.737Z"/>
                                            <path d="M11.241 9.817c-.36.275-.801.425-1.255.427-.428 0-.845-.138-1.187-.395L0 2.6V14a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V2.5l-8.759 7.317Z"/>
                                        </svg>
                                    </div>
                                    <input 
                                    data-th-field="*{websiteLink}"
                                    type="text" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5  dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
                                    placeholder="http://demo.com">
                                    </div>
                          </div>
                    </div>
                    <!-- linkedin link -->
                    <div class="w-full">
                        <div class="mb-2">                            
                                    <div class="relative mb-3">
                                    <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
                                        <i class="w-4 h-4 fa-brands fa-linkedin"></i>
                                            <path d="m10.036 8.278 9.258-7.79A1.979 1.979 0 0 0 18 0H2A1.987 1.987 0 0 0 .641.541l9.395 7.737Z"/>
                                            <path d="M11.241 9.817c-.36.275-.801.425-1.255.427-.428 0-.845-.138-1.187-.395L0 2.6V14a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V2.5l-8.759 7.317Z"/>
                                        </svg>
                                    </div>
                                    <input 
                                    data-th-field="*{linkedInLink}"
                                    type="text" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5  dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" 
                                    placeholder="http://linkedin.com/username">
                                    </div>
                          </div>
                    </div>
                  </div >
                  <!-- upload frofile pic -->
                  <div class="mb-2">
                    <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white" for="small_size">Contact Image</label>
                    <input 
                    id="image_file_input"
                    class="block w-full mb-0.5 text-xs text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400" 
                    data-th-field="*{contactImage}"
                    type="file">  
                    
                    <!-- img validation msg -->
                    <p class="text-red-600"
                            data-th-if="${#fields.hasErrors('contactImage')}"
                            data-th-errors="*{contactImage}"
                            >                           
                    </p>
                    
                    <!-- for image preview -->
                    <img class="max-h-52 mx-auto rounded-lg shadow m-3" src="" id="upload_image_preview" alt=""/>
                </div>

                  <!-- check box to mark as fav -->
                  <div class="flex items-center mb-3">
                    <input 
                    data-th-field="*{favorite}"
                    id="default-checkbox" type="checkbox" class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
                    <label for="default-checkbox" class="ms-2 text-sm font-medium text-gray-900 dark:text-gray-300">Mark as Favourite</label>
                </div>

                <!-- button -->
                <div class="button-container mb-3 flex justify-center space-x-3">
                     <button type="submit" class="px-3 py-2 rounded w-full bg-blue-700  text-white">ADD CONTACT</button>
                     <button type="reset" class="px-3 py-2 rounded w-full bg-orange-600  text-white">RESET</button>
                </div>
            </form>

            </div>
          </div>
         </div>
       </div>
    </div>


</div>
    <script>

    </script>
    <script data-th-src="@{'/JavaScript/admin.js'}">
        console.log("profile page")
    </script>
</body>
</html>
